<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Nifty 500</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; align-items: center; flex-wrap: wrap;}
        select, input, button { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #status { margin-top: 10px; color: #666; }
        
        /* Layout for Chart & List */
        .dashboard { display: flex; margin-top: 20px; height: 70vh; gap: 20px; }
        .stock-list { width: 200px; background: white; overflow-y: auto; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .chart-container { flex-grow: 1; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 10px; }
        
        .stock-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }
        .stock-item:hover { background-color: #e9ecef; }
    </style>
</head>
<body>

    <h2>Nifty 500 Dashboard</h2>

    <div class="controls">
        <select id="timeframe">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select>
        <input type="date" id="start" value="2024-01-01">
        <input type="date" id="end" value="2024-01-30">
        <button onclick="fetchData()">⬇ Fetch Data from Upstox</button>
        <span id="status">Ready.</span>
    </div>

    <div class="dashboard" id="dashboard" style="display:none;">
        <div class="stock-list" id="stockList">
            </div>
        <div class="chart-container" id="chart">
            </div>
    </div>

    <script>
        let currentFolder = '';

        async function fetchData() {
            const btn = document.querySelector('button');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "⏳ Connecting to Upstox... Downloading 500 Stocks (this takes ~1 min)...";
            status.style.color = "blue";

            const payload = {
                timeframe: document.getElementById('timeframe').value,
                startDate: document.getElementById('start').value,
                endDate: document.getElementById('end').value
            };

            try {
                const response = await fetch('/fetch-data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    status.innerText = `✅ Done! ${result.message}`;
                    status.style.color = "green";
                    currentFolder = result.folder;
                    populateStockList(result.stocks);
                    document.getElementById('dashboard').style.display = 'flex';
                } else {
                    status.innerText = "❌ Error: " + result.message;
                }
            } catch (err) {
                console.error(err);
                status.innerText = "❌ Server Error. Check console.";
            } finally {
                btn.disabled = false;
            }
        }

        function populateStockList(stocks) {
            const listContainer = document.getElementById('stockList');
            listContainer.innerHTML = '<h4>Select Stock:</h4>';
            
            stocks.forEach(symbol => {
                const div = document.createElement('div');
                div.className = 'stock-item';
                div.innerText = symbol;
                div.onclick = () => loadChart(symbol);
                listContainer.appendChild(div);
            });
        }

        async function loadChart(symbol) {
            const response = await fetch('/get-chart-data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ symbol: symbol, folder: currentFolder })
            });

            const data = await response.json();
            
            // Prepare Data for Plotly
            const dates = data.map(row => row.Timestamp);
            const open = data.map(row => row.Open);
            const high = data.map(row => row.High);
            const low = data.map(row => row.Low);
            const close = data.map(row => row.Close);

            const trace = {
                x: dates,
                close: close,
                decreasing: {line: {color: 'red'}},
                high: high,
                increasing: {line: {color: 'green'}},
                line: {color: 'rgba(31,119,180,1)'},
                low: low,
                open: open,
                type: 'candlestick',
                xaxis: 'x',
                yaxis: 'y'
            };

            const layout = {
                title: `${symbol} Price Chart`,
                dragmode: 'zoom',
                showlegend: false,
                xaxis: { title: 'Date', type: 'date'},
                yaxis: { title: 'Price (INR)'}
            };

            Plotly.newPlot('chart', [trace], layout);
        }
    </script>
</body>
</html>
